<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <!--DaisyUI & TailwindCSS CDN-->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--Google Fonts CDN for Poppins font-->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <!--Font Awesome CDN-->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <!--Custom CSS file-->
    <link rel="stylesheet" href="./style.css" />

    <title>Swift Cart</title>
  </head>
  <body class="text-5xl font-bold max-w-screen-2xl mx-auto">
    <header>
      <!-- Navigation Bar -->
      <nav>
        <div class="navbar bg-base-100 shadow-sm">
          <div class="navbar-start">
            <div class="dropdown">
              <div tabindex="0" role="button" class="pr-2 lg:hidden">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-5 w-5"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M4 6h16M4 12h8m-8 6h16"
                  />
                </svg>
              </div>
              <ul
                tabindex="-1"
                class="menu menu-sm dropdown-content bg-base-100 rounded-box z-1 mt-3 w-52 p-2 shadow"
              >
                <li><a>Home</a></li>
                <li><a>Products</a></li>
                <li><a>About</a></li>
                <li><a>Contact</a></li>
              </ul>
            </div>
            <a class="cursor-pointer text-xl text-[#452ef5]">SwiftCart</a>
          </div>
          <div class="navbar-center hidden lg:flex">
            <ul class="menu menu-horizontal px-1 font-medium">
              <li><a>Home</a></li>
              <li><a>Products</a></li>
              <li><a>About</a></li>
              <li><a>Contact</a></li>
            </ul>
          </div>
          <div class="navbar-end">
            <div class=" flex items-center">
              <i
                class="text-xl fa-solid fa-cart-shopping"
              ></i>
            </di>
          </div>
        </div>
      </nav>
      <!-- Hero Section -->
      <section>
        <div class="bg-[linear-gradient(to_right,rgba(0,0,0,0.7),rgba(0,0,0,0.4)),url('./Assets/banner-image.png')] bg-no-repeat bg-cover bg-center h-[500px] lg:h-[800px] flex flex-col justify-center">
                <div class="flex flex-col justify-center h-full space-y-2">
                    <h1 class="lg:ml-30 ml-5 lg:text-[65px] text-3xl text-white">Best Collection For You</h1>
                    <p class="lg:ml-30 ml-5 text-sm font-normal text-white w-[90%] lg:w-[35%] mb-5">
                         Discover the latest trends in fashion, electronics, and more. Shop with confidence and style at SwiftCart.
                    </p>
                    <button class="lg:ml-30 ml-5 btn btn-primary lg:px-12 lg:py-6 px-9 py-6 text-white w-fit">Shop Now</button>
                </div>
            </div>
      </section>
    </header>
  </body>
</html>
